<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Far Cry Coop</title>
<style>
  /* colors of the Far Cry 1 menu (Scripts/MenuScreens/UISystemCfg.lua) */
  :root {
    --focus: rgb(181 246 188); --border: rgb(47 66 53); --text: rgb(113 142 122);
    --light: rgb(162 194 170); --panel: rgb(0 0 0 / .64); --sel: rgb(162 194 170 / .25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    font: bold 13px Tahoma, Verdana, sans-serif; color: var(--light); text-transform: uppercase; letter-spacing: .04em;
    background:
      repeating-linear-gradient(0deg, rgb(0 0 0 / .18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 70% 20%, rgb(60 90 70 / .55), transparent 60%),
      linear-gradient(160deg, #10201a 0%, #06100c 55%, #020604 100%);
  }
  header {
    height: 64px; display: flex; align-items: center; padding: 0 24px;
    border-bottom: 2px solid var(--border); background: linear-gradient(#000c, #0006);
  }
  header h1 { margin: 0; font: 900 30px Impact, 'Arial Black', sans-serif; letter-spacing: .12em; color: var(--focus);
    text-shadow: 0 0 12px rgb(181 246 188 / .45); }
  header span { margin-left: 14px; color: var(--text); font-size: 12px; }
  main { display: grid; grid-template-columns: 330px 1fr; gap: 16px; padding: 16px 24px; height: calc(100vh - 64px - 44px); }
  .panel { background: var(--panel); border: 1px solid var(--border); padding: 0 14px 14px; overflow: hidden; }
  .panel h2 { margin: 0 -14px 12px; padding: 7px 14px; font-size: 13px; color: var(--focus);
    background: linear-gradient(90deg, rgb(47 66 53 / .9), transparent); border-bottom: 1px solid var(--border); }
  label.cap { display: block; margin: 10px 0 6px; color: var(--text); font-size: 11px; }
  input[type=text], select {
    width: 100%; padding: 6px 8px; background: #000; color: var(--focus); border: 1px solid var(--border);
    font: bold 13px Tahoma, sans-serif; outline: none;
  }
  input[type=text]:focus, select:focus { border-color: var(--focus); }
  .colors { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .colors button { aspect-ratio: 1; border: 1px solid var(--border); cursor: pointer; padding: 0; }
  .colors button.on { outline: 2px solid var(--focus); outline-offset: 1px; }
  .weapons { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .weapons label { padding: 3px 4px; cursor: pointer; color: var(--text); }
  .weapons label:hover { color: var(--focus); background: var(--sel); }
  .weapons input { accent-color: var(--light); }
  .weapons label.on { color: var(--focus); }
  /* menu items in the style of the game's main menu */
  .item { display: block; width: 100%; margin: 4px 0; padding: 8px 10px; text-align: left; cursor: pointer;
    background: transparent; border: 1px solid transparent; color: var(--light);
    font: bold 17px Tahoma, sans-serif; text-transform: uppercase; letter-spacing: .06em; }
  .item:hover { color: var(--focus); border-color: var(--border); background: var(--sel); text-shadow: 0 0 8px rgb(181 246 188 / .5); }
  .item:disabled { color: #354a3c; background: none; border-color: transparent; text-shadow: none; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; }
  .players { list-style: none; margin: 0; padding: 0; }
  .players li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding: 7px 8px;
    border-bottom: 1px solid rgb(47 66 53 / .6); }
  .players li:nth-child(odd) { background: rgb(113 142 121 / .08); }
  .swatch { width: 22px; height: 22px; border: 1px solid var(--light); }
  .pname { color: var(--focus); font-size: 14px; text-transform: none; }
  .pweap { color: var(--text); font-size: 11px; margin-top: 2px; }
  .host-tag { color: var(--text); font-size: 10px; margin-left: 6px; }
  .hidden { display: none !important; }
  footer { height: 44px; display: flex; align-items: center; padding: 0 24px; border-top: 1px solid var(--border);
    background: #000a; color: var(--focus); font-size: 12px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 10px 0; cursor: pointer; color: var(--light); }
</style>
</head>
<body>
<header><h1>FAR CRY</h1><span>Кооператив / Co-op</span></header>

<main>
  <section class="panel">
    <h2>Игрок / Player</h2>
    <label class="cap">Имя / Name</label>
    <input type="text" id="name" maxlength="24">
    <label class="cap">Цвет рубашки / Shirt color</label>
    <div class="colors" id="colors"></div>
    <label class="cap" id="count"></label>
    <div class="weapons" id="weapons"></div>
  </section>

  <section class="panel" id="menu">
    <h2>Лобби / Lobby</h2>
    <label class="cap">Карта / Map</label>
    <select id="map"></select>
    <label class="cap">Сложность / Difficulty</label>
    <select id="diff"></select>
    <label class="cap">Ожидание у выхода, с / Exit wait, s</label>
    <input type="number" id="exittime" min="10" max="1800" step="10">
    <label class="check"><input type="checkbox" id="loadout"> Выкладка / Loadout</label>
    <button class="item" id="host">› Создать лобби / Host lobby</button>
    <label class="cap">IP хоста / Host IP</label>
    <input type="text" id="ip" placeholder="192.168.1.5">
    <button class="item" id="join">› Войти в лобби / Join lobby</button>
    <button class="item" id="steam">› Ждать приглашения Steam / Steam invite</button>
    <button class="item" id="test">› Тест на одном ПК / Test on one PC</button>
  </section>

  <section class="panel hidden" id="room">
    <h2 id="roomtitle">Лобби / Lobby</h2>
    <div class="row">
      <div style="flex:1"><label class="cap">Карта / Map</label><select id="rmap"></select></div>
      <label class="check" style="margin-top:28px"><input type="checkbox" id="rloadout"> Выкладка / Loadout</label>
    </div>
    <label class="cap">Игроки / Players</label>
    <ul class="players" id="players"></ul>
    <button class="item" id="start">› Начать / Start</button>
    <button class="item" id="leave">› Выйти / Leave</button>
  </section>
</main>

<footer id="status">TCP 49002 — лобби, UDP 49001 — игра / lobby, game</footer>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
// MultiplayerUtils.ModelColor, index = p_color
const COLORS = ['#000', '#fff', '#00f', '#0f0', '#f00', '#0ff', '#ff0', '#f0f', '#ff8000', '#808080'];
const WEAPONS = ['Machete', 'Falcon', 'MP5', 'P90', 'M4', 'AG36', 'OICW', 'Shotgun', 'SniperRifle', 'M249', 'RL'];
const $ = id => document.getElementById(id);
const DIFFS = ['Лёгкий / Easy', 'Средний / Medium', 'Сложный / Challenging', 'Ветеран / Veteran', 'Реализм / Realistic'];
let s = { name: '', color: 1, weapons: [], loadout: false, map: '', ip: '', difficulty: 1, exit_time: 120 };
let room = null; // last lobby state from the host
let hosting = false; // set before lobby_host: its first state arrives during the call

function renderMe() {
  $('name').value = s.name;
  $('colors').replaceChildren(...COLORS.map((c, i) => {
    const b = document.createElement('button');
    b.style.background = c;
    b.className = i === s.color ? 'on' : '';
    b.onclick = () => { s.color = i; changed(); };
    return b;
  }));
  $('count').textContent = `Оружие ${s.weapons.length}/4 / Weapons ${s.weapons.length}/4`;
  $('weapons').replaceChildren(...WEAPONS.map(w => {
    const l = document.createElement('label');
    const on = s.weapons.includes(w);
    const box = document.createElement('input');
    box.type = 'checkbox'; box.checked = on; box.disabled = !on && s.weapons.length >= 4;
    box.onchange = () => { s.weapons = box.checked ? [...s.weapons, w] : s.weapons.filter(x => x !== w); changed(); };
    l.className = on ? 'on' : '';
    l.append(box, ' ' + w);
    return l;
  }));
  $('map').value = s.map; $('rmap').value = s.map;
  $('loadout').checked = s.loadout; $('rloadout').checked = s.loadout;
  $('diff').value = s.difficulty;
  $('exittime').value = s.exit_time ?? 120;
  $('ip').value = s.ip;
}

async function changed() {
  renderMe();
  try {
    await invoke('save_settings', { json: JSON.stringify(s) });
    if (room) await invoke('lobby_update', { map: s.map, loadout: s.loadout });
  } catch (e) { status(e); }
}

function status(t) { $('status').textContent = t; }

function renderRoom(v) {
  room = v;
  $('menu').classList.toggle('hidden', !!room);
  $('room').classList.toggle('hidden', !room);
  if (!room) return;
  const host = room.host;
  $('roomtitle').textContent = host ? 'Ваше лобби / Your lobby' : 'Лобби хоста / Host lobby';
  $('rmap').disabled = !host; $('rloadout').disabled = !host; $('start').classList.toggle('hidden', !host);
  if (!host) {
    if (![...$('rmap').options].some(o => o.value === room.map)) $('rmap').add(new Option(room.map));
    $('rmap').value = room.map; $('rloadout').checked = room.loadout;
  }
  $('players').replaceChildren(...room.players.map((p, i) => {
    const li = document.createElement('li');
    const sw = document.createElement('div'); sw.className = 'swatch'; sw.style.background = COLORS[p.color] || '#fff';
    const info = document.createElement('div');
    const n = document.createElement('div'); n.className = 'pname'; n.textContent = p.name; // names come from other players: text only
    if (i === 0) { const t = document.createElement('span'); t.className = 'host-tag'; t.textContent = 'ХОСТ / HOST'; n.append(t); }
    const w = document.createElement('div'); w.className = 'pweap';
    w.textContent = room.loadout ? (p.weapons.length ? p.weapons.join(' · ') : 'без оружия / no weapons') : 'оружие миссии / mission weapons';
    info.append(n, w);
    li.append(sw, info);
    return li;
  }));
}

listen('lobby', e => {
  const v = e.payload;
  if (v.t === 'state') { renderRoom({ ...v, host: hosting }); status(`Игроков / Players: ${v.players.length}`); }
  else if (v.t === 'start') status('Игра запускается / Starting the game');
  else if (v.t === 'go') status('Сервер готов, подключение / Server is up, connecting');
  else if (v.t === 'closed') { renderRoom(null); status('Лобби закрыто / Lobby closed'); }
});

const act = (cmd, args, ok) => invoke(cmd, args).then(() => ok && status(ok)).catch(e => status(e));
$('name').onchange = e => { s.name = e.target.value.trim(); changed(); };
$('map').onchange = $('rmap').onchange = e => { s.map = e.target.value; changed(); };
$('diff').onchange = e => { s.difficulty = +e.target.value; changed(); };
$('exittime').onchange = e => { s.exit_time = Math.min(1800, Math.max(10, Math.round(+e.target.value) || 120)); changed(); };
$('loadout').onchange = $('rloadout').onchange = e => { s.loadout = e.target.checked; changed(); };
$('ip').onchange = e => { s.ip = e.target.value.trim(); changed(); };
$('host').onclick = () => (hosting = true) && act('lobby_host', { map: s.map, loadout: s.loadout }, 'Лобби создано, ждём игроков / Lobby is up');
$('join').onclick = () => (hosting = false, act('lobby_join', { ip: s.ip }, 'В лобби / Joined'));
$('steam').onclick = () => act('launch_steam', {}, 'Игра запускается, примите приглашение в Steam / Accept the Steam invite');
$('test').onclick = () => act('launch_test', { map: s.map, loadout: s.loadout }, 'Хост слева, клиент справа подключится сам / Host left, client right joins by itself');
$('start').onclick =() => act('lobby_start', {});
$('leave').onclick = () => act('lobby_leave', {});

(async () => {
  try { s = { ...s, ...JSON.parse(await invoke('load_settings')) }; } catch (e) {}
  if (!s.name) s.name = await invoke('game_name') || 'Player';
  try {
    const maps = await invoke('list_maps');
    // story order from the host; the saves (save:<name>) follow without a number
    let n = 0;
    for (const sel of [$('map'), $('rmap')]) { n = 0; sel.replaceChildren(...maps.map(m => new Option(m.startsWith('save:') ? m : `${++n}. ${m}`, m))); }
    $('diff').replaceChildren(...DIFFS.map((d, i) => new Option(d, i)));
    if (!maps.includes(s.map)) s.map = maps[0] || '';
  } catch (e) { status(e); }
  renderMe();
  invoke('save_settings', { json: JSON.stringify(s) });
})();
</script>
</body>
</html>
